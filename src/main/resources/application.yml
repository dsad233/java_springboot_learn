spring:
  application:
    name: post

  web:
    error:
      include-message: always

  config:
    import: optional:file:.env[.properties]

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASS}

  jpa:
    #true 설정 시 jpa 쿼리문 확인 가능
    show-sql: ${DB_SHOW_SQL}
    hibernate:
      #DDL 정의시 DB의 고유 기능을 사용 가능
      ddl-auto: ${DB_DDL_AUTO}
    properties:
      hibernate:
        # JPA의 구현체인 Hibernate가 동작하면서 발생한 SQL의 가독성을 높여줌
        format_sql: ${DB_FORMAT_SQL}

  redis:
    host: ${REDIS_HOST}
    port: ${REDIS_PORT}
    user: ${REDIS_USER}
    pass: ${REDIS_PASS}
    db: ${REDIS_DB}
    tls: ${REDIS_TLS}
    lettuce:
      pool:
        max-active: ${REDIS_LETTUCE_POOL_MAX_ACTIVE}
        max-idle: ${REDIS_LETTUCE_POOL_MAX_IDLE}
        min-idle: ${REDIS_LETTUCE_POOL_MIN_IDLE}
        shutdown-timeout: ${REDIS_LETTUCE_SHOUTDOWN_TIMEOUT}

  jwt:
    access:
      secret: ${JWT_ACCESS_SECRET_KEY}
      expiration: ${JWT_ACCESS_EXPIRATION}
    refresh:
      secret: ${JWT_REFRESH_SECRET_KEY}
      expiration: ${JWT_REFRESH_EXPIRATION}